[package]
name = "rekordcrate"
version = "0.3.0"
authors = ["Jan Holthuis <jan.holthuis@ruhr-uni-bochum.de>"]
description = "Library for parsing Pioneer Rekordbox device exports"
readme = "README.md"
repository = "https://github.com/Holzhaus/rekordcrate"
license = "MPL-2.0"
keywords = ["rekordbox", "dj", "export", "database", "parser"]
categories = ["parser-implementations"]
edition = "2021"
exclude = [".*"]

[lib]
# `staticlib` lets a C++ consumer (e.g. libdjinterop via Corrosion) link the
# crate and generate the cxx headers itself. `rlib` keeps normal Rust consumers.
crate-type = ["rlib", "staticlib"]

[dependencies]
binrw = "0.15"
modular-bitfield = "0.13"
crc16 = "0.4"
clap = { version = "4.6", features = ["derive"], optional = true }
parse-display = "0.11"
thiserror = "2.0"
quick-xml = { version = "0.40.1", features = ["serialize", "serde-types"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_repr = { version = "0.1.19", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
rgb = { version = "0.8", optional = true }
fallible-iterator = "0.3.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }
symphonia = { version = "0.6.0", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "flac", "pcm"], optional = true }
realfft = { version = "3.5", optional = true }
cxx = { version = "1.0", optional = true }

[build-dependencies]
glob = "0.3"

[dev-dependencies]
pretty-hex = "0.4"
pretty_assertions = "1"

[features]
default = ["cli", "xml"]
cli = ["dep:clap"]
xml = ["dep:serde", "dep:serde_repr", "dep:quick-xml", "dep:chrono", "dep:rgb"]
artwork = ["dep:image"]
analysis = ["dep:symphonia", "dep:realfft"]
cpp = ["dep:cxx"]

[[bin]]
name = "rekordcrate"
required-features = ["cli"]
